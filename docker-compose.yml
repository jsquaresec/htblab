services:
  bot:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
      - htb-data:/data
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python bot.py"
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - HTB_WEBHOOK=${HTB_WEBHOOK}
    restart: unless-stopped

  runner:
    build: .
    # Host network so the container uses your host's HTB VPN tunnel (tun0).
    network_mode: host
    volumes:
      - htb-data:/data
    environment:
      - HTB_WEBHOOK=${HTB_WEBHOOK}
    restart: unless-stopped

volumes:
  htb-data:
