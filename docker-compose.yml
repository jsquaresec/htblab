services:
  bot:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app:ro
      - htb-data:/data
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python -u bot.py"
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      HTB_WEBHOOK: ${HTB_WEBHOOK:-}
    restart: unless-stopped

  runner:
    build: .
    # Host network lets the runner reach the host HTB VPN tunnel.
    network_mode: host
    volumes:
      - htb-data:/data
    environment:
      HTB_WEBHOOK: ${HTB_WEBHOOK:-}
    restart: unless-stopped

volumes:
  htb-data:
